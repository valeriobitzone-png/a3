name: CI

on:
  push:
  pull_request:

jobs:
  spec-and-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Public boundary guard (tree and full history)
        run: |
          python3 tools/public_boundary.py
          python3 tools/public_boundary.py --history
          python3 python/tests/test_public_boundary.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run specification tests
        run: |
          python3 spec/test_spec.py
          python3 spec/test_a3ui_spec.py
      - name: Run Python conformance
        run: python3 conformance/src/test/python/test_conformance.py

  python-a3ep:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: a3ep against the shared corpus
        run: python3 python/tests/test_a3ep.py
      - name: receipt-is-not-fact demo is reproducible
        run: python3 python/tests/test_demo.py
      - name: README gate (every README command, run literally)
        run: python3 tools/readme_gate.py
